name: Build Desktop Template

on:
  push:
    branches:
      - main

env:
  RAYLIB_REF: "5.5"

jobs:
  linux:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    env:
      APP: example
      PLATFORM: Linux

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Environment
      run: |
        sudo apt-get update -qq
        sudo apt-get install gcc-multilib
        sudo apt-get install -y --no-install-recommends \
          libx11-dev mesa-common-dev \
          libglx-dev \
          libxcursor-dev \
          mesa-vulkan-drivers \
          libxcursor-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxi-dev \
          libxext-dev \
          libxfixes-dev \
          libwayland-dev \
          libxkbcommon-dev \
          libgles2-mesa-dev

    - name: Fetch vendor headers (nuklear, miniaudio)
      run: make fetch

    - name: Fetch raylib
      run: |
        git clone --depth 1 --branch ${{ env.RAYLIB_REF }} \
          https://github.com/raysan5/raylib.git ./vendor/raylib/raylib

    - name: Build Raylib
      run: |
        cd ./vendor/raylib/raylib/src
        make PLATFORM=PLATFORM_DESKTOP

    - name: Build Library
      run: make build

    - name: Generate Artifacts
      run: |
        cd build
        tar -czvf ${{ env.PLATFORM }}.tar.gz ./${{ env.PLATFORM }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PLATFORM }}.tar.gz
        path: ./build/${{ env.PLATFORM }}.tar.gz

    # - name: Upload Artifact to Release
    #   uses: softprops/action-gh-release@v1
    #   with:
    #     files: ./build/${{ env.PLATFORM }}.tar.gz
    #   env:
    #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  darwin:
    permissions:
      contents: write
    # macos-latest runners are Apple Silicon (arm64); we build native-arch only,
    # since the Makefile links a single libraylib.a with no per-arch lib paths
    runs-on: macos-latest

    env:
      PLATFORM: Darwin

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Fetch vendor headers (nuklear, miniaudio)
      run: make fetch

    - name: Fetch raylib
      run: |
        git clone --depth 1 --branch ${{ env.RAYLIB_REF }} \
          https://github.com/raysan5/raylib.git ./vendor/raylib/raylib

    # Defining GL_SILENCE_DEPRECATION because OpenGL is deprecated on macOS
    - name: Build Raylib
      run: |
        cd ./vendor/raylib/raylib/src
        make PLATFORM=PLATFORM_DESKTOP CUSTOM_CFLAGS="-DGL_SILENCE_DEPRECATION"

    - name: Build Library
      run: |
        clang --version
        make build CUSTOM_CFLAGS="-DGL_SILENCE_DEPRECATION"

    - name: Generate Artifacts
      run: |
        cd build
        tar -czvf ${{ env.PLATFORM }}.tar.gz ./${{ env.PLATFORM }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PLATFORM }}.tar.gz
        path: ./build/${{ env.PLATFORM }}.tar.gz

    # - name: Upload Artifact to Release
    #   uses: softprops/action-gh-release@v1
    #   with:
    #     files: ./build/${{ env.PLATFORM }}.tar.gz
    #   env:
    #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    permissions:
      contents: write
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        compiler: [mingw-w64]
        bits: [64]
        include:
        - compiler: mingw-w64
          bits: 64
          ARCH: "x86_64"
          WINDRES_ARCH: pe-x86-64

    env:
      PLATFORM: Windows
      GNUTARGET: default

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Fetch vendor headers (nuklear, miniaudio)
      shell: cmd
      run: make fetch

    - name: Fetch raylib
      shell: cmd
      run: |
        git clone --depth 1 --branch ${{ env.RAYLIB_REF }} https://github.com/raysan5/raylib.git .\vendor\raylib\raylib

    - name: Build Raylib (MinGW-w64 64bit)
      shell: cmd
      run: |
        ${{ matrix.ARCH }}-w64-mingw32-gcc.exe --version
        cd vendor\raylib\raylib\src
        make PLATFORM=PLATFORM_DESKTOP
      if: |
        matrix.compiler == 'mingw-w64' &&
        matrix.bits == 64

    - name: Build Library (MinGW-w64 64bit)
      run: |
        ${{ matrix.ARCH }}-w64-mingw32-gcc.exe --version
        windres.exe --version
        dir C:\msys64\mingw64\bin
        make build PLATFORM=${{env.PLATFORM}} EXT=.exe
      shell: cmd
      if: |
        matrix.compiler == 'mingw-w64' &&
        matrix.bits == 64

    - name: Generate Artifacts
      run: |
        cd build
        7z a ./${{ env.PLATFORM }}.zip ./${{ env.PLATFORM }}
        dir
      shell: cmd

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PLATFORM }}.zip
        path: ./build/${{ env.PLATFORM }}.zip

    # - name: Upload Artifact to Release
    #   uses: softprops/action-gh-release@v1
    #   with:
    #     files: ./build/${{ env.PLATFORM }}.zip
    #   env:
    #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
